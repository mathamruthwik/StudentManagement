
name: Java Hello World

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  run-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Compile Java
        run: javac hellojava.java

      - name: Run Java
        run: java hellojava
